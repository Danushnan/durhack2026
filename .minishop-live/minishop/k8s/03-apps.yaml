apiVersion: apps/v1
kind: Deployment
metadata:
  name: minishop-web
  namespace: minishop
  labels:
    app: minishop-web
    app.kubernetes.io/name: minishop-web
    app.kubernetes.io/part-of: kubeverse-demo
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: minishop-web
  template:
    metadata:
      labels:
        app: minishop-web
        app.kubernetes.io/name: minishop-web
        app.kubernetes.io/part-of: kubeverse-demo
        app.kubernetes.io/component: frontend
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: workload
        image: minishop-web:demo
        env:
        - name: UPSTREAM_SUFFIX
          value: .minishop.svc.cluster.local
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 96Mi
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 6
        securityContext:
          allowPrivilegeEscalation: false
---
