apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-api
  namespace: minishop
  labels:
    app: product-api
    app.kubernetes.io/name: product-api
    app.kubernetes.io/part-of: kubeverse-demo
    app.kubernetes.io/component: products
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: product-api
  template:
    metadata:
      labels:
        app: product-api
        app.kubernetes.io/name: product-api
        app.kubernetes.io/part-of: kubeverse-demo
        app.kubernetes.io/component: products
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: workload
        image: minishop-product-api:demo
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 192Mi
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 6
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        envFrom:
        - configMapRef:
            name: minishop-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: minishop-secrets
              key: DATABASE_URL
      dnsConfig:
        options:
        - name: ndots
          value: '1'
---
apiVersion: v1
kind: Service
metadata:
  name: product-api
  namespace: minishop
  labels:
    app: product-api
    app.kubernetes.io/name: product-api
    app.kubernetes.io/part-of: kubeverse-demo
    app.kubernetes.io/component: products
spec:
  selector:
    app: product-api
  ports:
  - name: http
    port: 8000
    targetPort: 8000
---
