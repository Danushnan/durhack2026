apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: minishop
  labels:
    app: postgres-data
    app.kubernetes.io/name: postgres-data
    app.kubernetes.io/part-of: kubeverse-demo
    app.kubernetes.io/component: database
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: minishop
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: kubeverse-demo
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: kubeverse-demo
        app.kubernetes.io/component: database
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: workload
        image: postgres:17-alpine
        env:
        - name: POSTGRES_USER
          value: minishop
        - name: POSTGRES_DB
          value: minishop
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minishop-secrets
              key: POSTGRES_PASSWORD
        ports:
        - name: data
          containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
          subPath: pgdata
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
        startupProbe:
          exec: &id001
            command:
            - pg_isready
            - -U
            - minishop
            - -d
            - minishop
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 36
        readinessProbe:
          exec: *id001
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          exec: *id001
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: minishop
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: kubeverse-demo
    app.kubernetes.io/component: database
spec:
  selector:
    app: postgres
  ports:
  - name: data
    port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: minishop
  labels:
    app: redis-data
    app.kubernetes.io/name: redis-data
    app.kubernetes.io/part-of: kubeverse-demo
    app.kubernetes.io/component: cache
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: minishop
  labels:
    app: redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: kubeverse-demo
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: kubeverse-demo
        app.kubernetes.io/component: cache
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: workload
        image: redis:8-alpine
        args:
        - redis-server
        - --appendonly
        - 'yes'
        - --maxmemory
        - 64mb
        - --maxmemory-policy
        - noeviction
        ports:
        - name: data
          containerPort: 6379
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        startupProbe:
          exec: &id001
            command:
            - redis-cli
            - ping
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 36
        readinessProbe:
          exec: *id001
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          exec: *id001
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: minishop
  labels:
    app: redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: kubeverse-demo
    app.kubernetes.io/component: cache
spec:
  selector:
    app: redis
  ports:
  - name: data
    port: 6379
    targetPort: 6379
