apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../k8s
images:
  - name: minishop-product-api
    newName: lhr.vultrcr.com/minifini2/minishop-product-api
    newTag: vke-4381952
  - name: minishop-cart-api
    newName: lhr.vultrcr.com/minifini2/minishop-cart-api
    newTag: vke-4381952
  - name: minishop-checkout-api
    newName: lhr.vultrcr.com/minifini2/minishop-checkout-api
    newTag: vke-4381952
  - name: minishop-payment-api
    newName: lhr.vultrcr.com/minifini2/minishop-payment-api
    newTag: vke-4381952
  - name: minishop-web
    newName: lhr.vultrcr.com/minifini2/minishop-web
    newTag: vke-4381952
patches:
  - target:
      kind: Deployment
      name: product-api|cart-api|checkout-api|payment-api|minishop-web
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: minishop-registry
  - target:
      kind: Job
      name: minishop-migrate
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: minishop-registry
  - target:
      kind: Secret
      name: minishop-secrets
    patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: minishop-secrets
      $patch: delete
  - target:
      kind: PersistentVolumeClaim
      name: postgres-data|redis-data
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi
