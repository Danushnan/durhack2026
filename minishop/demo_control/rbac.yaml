# Optional: have the cluster owner install this and provision a local kubeconfig
# for the operator identity. The application does not install RBAC itself.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minishop-demo-operator
  namespace: minishop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: minishop-demo-operator
  namespace: minishop
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [payment-api, checkout-api]
    verbs: [get, patch, watch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: [checkout-api]
    verbs: [get, patch, update]
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [minishop-config]
    verbs: [get]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: minishop-demo-operator
  namespace: minishop
subjects:
  - kind: ServiceAccount
    name: minishop-demo-operator
    namespace: minishop
roleRef:
  kind: Role
  name: minishop-demo-operator
  apiGroup: rbac.authorization.k8s.io
